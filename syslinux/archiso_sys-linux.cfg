LABEL arch
TEXT HELP
Boot the x Linux install medium on BIOS.
It allows you to install x Linux or perform system maintenance.
ENDTEXT
MENU LABEL x Linux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Unattended install (xauto=1 + a disk labeled cidata with x-install.json).
# Hotkey: a. See docs/installer.md (Autoinstall) and docs/vm-testing.md.
LABEL xauto
TEXT HELP
Unattended install. Requires xauto=1 (already set here) and a disk labeled
cidata containing x-install.json. See the installer documentation.
ENDTEXT
MENU LABEL x Linux ^autoinstall (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% xauto=1 console=ttyS0

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the x Linux install medium on BIOS with speakup screen reader.
It allows you to install x Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL x Linux install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on

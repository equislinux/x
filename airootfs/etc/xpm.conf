[options]
root_dir = "/"
db_path = "/var/lib/xpm"
cache_dir = "/var/cache/xpm/pkg"
log_file = "/var/log/xpm.log"
gpg_dir = "/etc/pacman.d/gnupg"
pacman_db = "/var/lib/pacman"
mirror_pacman = true
shell_integration = false
sig_level = "required"
database_sig_level = "optional"
architecture = "x86_64"
color = false
parallel_downloads = 5

[[repo]]
name = "x"
server = ["https://equislinux.github.io/x-repo/repo/x86_64"]
sig_level = "required"
database_sig_level = "required"

[[repo]]
name = "core"
server = ["https://geo.mirror.pkgbuild.com/$repo/os/$arch"]
sig_level = "required"
database_sig_level = "optional"

[[repo]]
name = "extra"
server = ["https://geo.mirror.pkgbuild.com/$repo/os/$arch"]
sig_level = "required"
database_sig_level = "optional"
